[project]
name = "advanced-rag"
version = "0.1.0"
description = "A secure, multi-tenant advanced RAG platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "dramatiq[redis]>=1.17,<2",
  "fastapi>=0.115,<1",
  "pgvector>=0.3,<1",
  "pypdf>=5.0,<6",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.18,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "unit: isolated unit tests",
  "integration: tests requiring infrastructure",
  "security: authorization and security tests",
  "e2e: end-to-end API tests",
  "evaluation: evaluation regression tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["pypdf"]
ignore_missing_imports = true
