name: CI

# on:
#   pull_request:
#   push:
#     branches: [main]
on:
  workflow_dispatch:
  
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run ruff check app tests
      - run: uv run mypy app
      - run: uv run pytest -m "not integration"
